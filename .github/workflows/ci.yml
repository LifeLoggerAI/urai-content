name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run validate:sprites
      - run: npm run content:index
      - run: git diff --exit-code
      - run: npm run smoke
      - run: npm test
      - run: npm run build
      - run: npm run seed:check
      - run: npm run seed:system:check
      - run: npm run verify
      - run: npm run done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run web:install
      - run: npm run web:check
      - name: Smoke test web routes
        run: npm run web:smoke:routes

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run web:install
      - run: npm run web:check
      - name: Install browser smoke runtime
        run: npm run e2e:install --prefix apps/web
      - name: Browser smoke test
        run: npm run web:e2e
