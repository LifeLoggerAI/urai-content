name: Content Dependency Remediation Materializer

on:
  push:
    branches:
      - agent/content-dependency-materialize-20260913

permissions:
  contents: read

concurrency:
  group: content-dependency-materializer-${{ github.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Capture before audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/before artifacts/after artifacts/candidate
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web
          npm audit --json > artifacts/before/root-audit.json || true
          npm audit --json --prefix apps/web > artifacts/before/web-audit.json || true

      - name: Upgrade package manager for remediation only
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11
          npm --version | tee artifacts/candidate/npm-version.txt

      - name: Materialize bounded dependency upgrades
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.devDependencies.vitest = '4.1.11';
          root.devDependencies.tsx = '4.23.9';
          root.overrides = {
            'minimatch@3.1.5': {'brace-expansion': '1.1.18'},
            'minimatch@10.2.5': {'brace-expansion': '5.0.9'},
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          const webPath = 'apps/web/package.json';
          const web = JSON.parse(fs.readFileSync(webPath, 'utf8'));
          web.dependencies.next = '15.5.24';
          web.dependencies['@next/env'] = '15.5.24';
          web.dependencies['firebase-admin'] = '14.4.0';
          web.devDependencies['eslint-config-next'] = '15.5.24';
          web.devDependencies.vitest = '4.1.11';
          web.overrides = {
            'next': {'postcss': '8.5.23', 'sharp': '0.35.4'},
            'gaxios@6.7.1': {'uuid': '11.1.1'},
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync(webPath, JSON.stringify(web, null, 2) + '\n');
          NODE
          rm -rf node_modules apps/web/node_modules
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix apps/web

      - name: Verify synchronized frozen installs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules apps/web/node_modules
          npm ci
          npm ci --prefix apps/web

      - name: Checkpoint candidate for source verification
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(package.json|package-lock.json|apps/web/package.json|apps/web/package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes before candidate verification:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "URAI dependency materializer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json apps/web/package-lock.json
          git commit -m "chore: ephemeral dependency remediation candidate"

      - name: Verify root source
        shell: bash
        run: npm run check

      - name: Verify web typecheck
        shell: bash
        run: npm run typecheck --prefix apps/web

      - name: Verify web lint
        shell: bash
        run: npm run lint --prefix apps/web

      - name: Verify web tests
        shell: bash
        run: npm test --prefix apps/web

      - name: Verify web production build
        shell: bash
        run: npm run build --prefix apps/web

      - name: Capture after audit and candidate
        if: always()
        shell: bash
        run: |
          set -u
          npm audit --json > artifacts/after/root-audit.json || true
          npm audit --json --prefix apps/web > artifacts/after/web-audit.json || true
          cp package.json package-lock.json artifacts/candidate/
          mkdir -p artifacts/candidate/apps/web
          cp apps/web/package.json apps/web/package-lock.json artifacts/candidate/apps/web/
          git show --format= -- package.json package-lock.json apps/web/package.json apps/web/package-lock.json > artifacts/candidate/dependency-remediation.diff || true
          printf '%s\n' "${{ github.sha }}" > artifacts/candidate/source-sha.txt

      - name: Upload candidate and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-dependency-remediation-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
