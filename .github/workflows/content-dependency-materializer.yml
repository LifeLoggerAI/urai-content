name: Content Dependency Remediation Promotion

on:
  push:
    branches:
      - agent/content-dependency-materialize-20260913

permissions:
  contents: write

concurrency:
  group: content-dependency-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout certified main parent
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fail closed on parent drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4b38589be76dff88e310fc11b9bba5ce8b793d19"
          test "$(git status --porcelain)" = ""

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Use remediation package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11
          npm --version

      - name: Materialize verified zero-audit graph
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.devDependencies.vitest = '4.1.11';
          root.devDependencies.tsx = '4.23.9';
          root.overrides = {
            'minimatch@3.1.5': {'brace-expansion': '1.1.18'},
            'minimatch@10.2.5': {'brace-expansion': '5.0.9'},
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          const webPath = 'apps/web/package.json';
          const web = JSON.parse(fs.readFileSync(webPath, 'utf8'));
          web.dependencies.next = '15.5.24';
          web.dependencies['@next/env'] = '15.5.24';
          web.dependencies['firebase-admin'] = '14.4.0';
          web.devDependencies['eslint-config-next'] = '15.5.24';
          web.devDependencies.vitest = '4.1.11';
          web.overrides = {
            'next': {'postcss': '8.5.23', 'sharp': '0.35.4'},
            'gaxios@6.7.1': {'uuid': '11.1.1'},
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync(webPath, JSON.stringify(web, null, 2) + '\n');
          NODE
          rm -rf node_modules apps/web/node_modules
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix apps/web

      - name: Verify synchronized frozen installs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules apps/web/node_modules
          npm ci
          npm ci --prefix apps/web

      - name: Prove zero audit findings
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=low
          npm audit --audit-level=low --prefix apps/web

      - name: Commit exactly four dependency files locally
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(package.json|package-lock.json|apps/web/package.json|apps/web/package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "URAI dependency remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json apps/web/package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "security: remediate Content dependency audit findings"

      - name: Re-earn source and web verification
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run typecheck --prefix apps/web
          npm run lint --prefix apps/web
          npm test --prefix apps/web
          npm run build --prefix apps/web
          git diff --exit-code

      - name: Publish clean successor branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/security/content-dependencies-20260913
