name: Content dependency remediation candidate

on:
  push:
    branches:
      - public-authority-consolidation-20260905

permissions:
  contents: read

concurrency:
  group: content-dependency-remediation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Generate synchronized lockfiles with npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix apps/web

      - name: Frozen install generated dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web

      - name: Audit generated graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/content-dependency-remediation
          npm audit --json > artifacts/content-dependency-remediation/root-audit.json || true
          npm audit --json --prefix apps/web > artifacts/content-dependency-remediation/web-audit.json || true

      - name: Verify root and web
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run typecheck --prefix apps/web
          npm test --prefix apps/web
          npm run build --prefix apps/web

      - name: Retain npm-generated candidates
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json artifacts/content-dependency-remediation/root-package-lock.json
          cp apps/web/package-lock.json artifacts/content-dependency-remediation/web-package-lock.json
          git diff -- package-lock.json apps/web/package-lock.json > artifacts/content-dependency-remediation/generated-lockfiles.patch

      - name: Upload remediation candidate
        uses: actions/upload-artifact@v4
        with:
          name: content-dependency-remediation-${{ github.sha }}
          path: artifacts/content-dependency-remediation
          if-no-files-found: error
          retention-days: 90
