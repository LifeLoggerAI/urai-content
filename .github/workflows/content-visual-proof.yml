name: Content Visual Proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      URAI_CONTENT_VISUAL_DIR: artifacts/content-visual
      URAI_CONTENT_VISUAL_PRODUCTION: '1'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_HEAD }}
          persist-credentials: false
      - name: Prove exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install shared root source dependencies
        run: npm ci
      - name: Install web
        run: npx --yes npm@11.19.1 ci --prefix apps/web
      - name: Build exact-head web source for retained production proof
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          GITHUB_SHA="$EXACT_HEAD" URAI_CONTENT_BUILD_SHA="$EXACT_HEAD" npm run build
      - name: Install Chromium
        run: npm exec --prefix apps/web playwright install --with-deps chromium
      - name: Run exact-head visual proof
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          npm exec playwright test e2e/visual-proof.spec.ts
      - name: Write exact-head receipt
        if: always()
        shell: bash
        run: |
          mkdir -p apps/web/artifacts/content-visual
          printf '{"exactHead":"%s","proof":"content-public-and-current-missing-ui-pixels-with-anonymous-api-denial"}\n' "$EXACT_HEAD" > apps/web/artifacts/content-visual/receipt.json
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-content-visual-${{ env.EXACT_HEAD }}
          path: |
            apps/web/artifacts/content-visual
            apps/web/playwright-report
          if-no-files-found: error
