name: Content Vitest Toolchain Bootstrap

on:
  push:
    branches:
      - security/vitest-toolchain-20260801
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-vitest-toolchain-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.sha }}

jobs:
  bootstrap:
    name: Regenerate and prove synchronized Vitest lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Regenerate only root and web lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix apps/web
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package-lock.json|apps/web/package-lock.json)$' || true)"
          test -z "$unexpected"
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"

      - name: Install exact regenerated graphs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web

      - name: Prove root toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build

      - name: Prove web toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --prefix apps/web
          npm test --prefix apps/web
          npm run build --prefix apps/web

      - name: Record package and lock identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/content-vitest-toolchain
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const sha = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')
          const root = read('package.json')
          const web = read('apps/web/package.json')
          if (root.devDependencies?.vitest !== '4.1.10') throw new Error('Root Vitest version mismatch')
          if (web.devDependencies?.vitest !== '4.1.10') throw new Error('Web Vitest version mismatch')
          const receipt = {
            schemaVersion: 'urai-content-vitest-toolchain-1',
            exactHeadBeforeLockCommit: process.env.TARGET_SHA,
            rootVitest: root.devDependencies.vitest,
            webVitest: web.devDependencies.vitest,
            rootLockSha256: sha('package-lock.json'),
            webLockSha256: sha('apps/web/package-lock.json'),
            rootTypecheckPassed: true,
            rootTestsPassed: true,
            rootBuildPassed: true,
            webTypecheckPassed: true,
            webTestsPassed: true,
            webBuildPassed: true,
            productionDeploymentAttempted: false,
            providerMutation: false
          }
          fs.writeFileSync('artifacts/content-vitest-toolchain/receipt.json', `${JSON.stringify(receipt, null, 2)}\n`)
          console.log(JSON.stringify(receipt, null, 2))
          NODE

      - name: Upload pre-commit toolchain receipt
        uses: actions/upload-artifact@v4
        with:
          name: content-vitest-toolchain-${{ env.TARGET_SHA }}
          path: artifacts/content-vitest-toolchain/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit proven lockfile changes once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json apps/web/package-lock.json; then
            echo 'Lockfiles already synchronized; no commit required.'
            exit 0
          fi
          changed="$(git diff --name-only)"
          test "$changed" = $'apps/web/package-lock.json\npackage-lock.json' || test "$changed" = $'package-lock.json\napps/web/package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json apps/web/package-lock.json
          git commit -m 'Regenerate locks for Vitest 4.1.10'
          git push origin "HEAD:${GITHUB_REF_NAME}"
