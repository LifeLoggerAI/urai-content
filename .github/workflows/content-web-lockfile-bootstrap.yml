name: Content Web Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/content-reproducible-web-lockfile-20260801
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-web-lockfile-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  bootstrap:
    name: Generate, prove, and admit web lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root graph from committed lockfile
        run: npm ci --ignore-scripts

      - name: Materialize web lockfile when absent
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if test -f apps/web/package-lock.json; then
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts --prefix apps/web
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prove frozen web graph
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/package-lock.json
          npm ci --ignore-scripts --prefix apps/web
          npm run typecheck --prefix apps/web
          npm test --prefix apps/web
          npm run build --prefix apps/web

      - name: Record lockfile identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum apps/web/package-lock.json
          node -e "const p=require('./apps/web/package-lock.json'); if(p.lockfileVersion!==3) process.exit(1); console.log(JSON.stringify({name:p.name,version:p.version,lockfileVersion:p.lockfileVersion,packages:Object.keys(p.packages||{}).length},null,2));"

      - name: Upload exact-head lockfile
        uses: actions/upload-artifact@v4
        with:
          name: urai-content-web-lockfile-${{ env.TARGET_SHA }}
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove bounded working-tree state
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$changed"
          if test "${{ steps.lockfile.outputs.generated }}" = 'true'; then
            test "$changed" = '?? apps/web/package-lock.json'
          else
            test -z "$changed"
          fi

      - name: Commit generated lockfile to governed source branch
        if: github.event_name == 'push' && github.ref_name == 'agent/content-reproducible-web-lockfile-20260801' && steps.lockfile.outputs.generated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          git commit -m 'Adopt deterministic web lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"
