name: Deploy URAI Content Web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment label
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      base_url:
        description: Expected deployed base URL for post-deploy smoke, for example https://content.urai.app
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-content-web-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded deploy and live smoke
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE_URL: ${{ github.event.inputs.base_url }}
      DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enforce production ADC identity gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            echo '::error::URAI Content production deployment is NO-GO until a Vercel-compatible short-lived Google/Firebase runtime identity is independently provisioned, verified, and recorded. This repository does not accept long-lived Firebase service-account private keys as a substitute.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate required deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured. Add it as a GitHub Actions secret before deploying."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install root dependencies
        run: npm ci

      - name: Verify root package and governance
        run: npm run check

      - name: Install web dependencies
        run: npm run web:install

      - name: Verify web runtime
        run: npm run web:check

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview environment
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build with Vercel
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt preview artifact
        id: deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "deployed_url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" > ../../deploy-url.txt
          echo "Deployed URL: $url"

      - name: Validate HTTPS deployment URLs
        run: |
          set -euo pipefail
          case "$EXPECTED_BASE_URL" in
            https://*) ;;
            *) echo "::error::base_url must use https://"; exit 1 ;;
          esac
          deployed_url="$(cat deploy-url.txt)"
          case "$deployed_url" in
            https://*) ;;
            *) echo "::error::Vercel deployment URL must use https://"; exit 1 ;;
          esac

      - name: Live HTTP smoke
        run: |
          set -euo pipefail
          mkdir -p launch-proof/live-deploy
          {
            echo "# Live deployment smoke"
            echo
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Environment: $DEPLOY_ENVIRONMENT"
            echo "Expected base URL: $EXPECTED_BASE_URL"
            echo "Vercel deploy URL: $(cat deploy-url.txt)"
            echo
            echo "## HTTP checks"
            curl -fsS -I "$EXPECTED_BASE_URL/"
            curl -fsS -I "$EXPECTED_BASE_URL/content"
            curl -fsS "$EXPECTED_BASE_URL/api/health"
            curl -fsS "$EXPECTED_BASE_URL/api/version"
          } | tee launch-proof/live-deploy/latest-smoke.md

      - name: Runtime route smoke
        run: npm run web:smoke:routes -- --base-url="$EXPECTED_BASE_URL"

      - name: Upload deploy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-content-preview-deploy-evidence-${{ github.sha }}
          path: |
            deploy-url.txt
            launch-proof/live-deploy/latest-smoke.md
          if-no-files-found: error
