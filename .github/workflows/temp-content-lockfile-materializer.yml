name: TEMP Content lockfile materializer

on:
  push:
    branches:
      - hardening/content-review-supply-chain-20261005

permissions:
  contents: write

concurrency:
  group: temp-content-lockfile-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: hardening/content-review-supply-chain-20261005
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Regenerate synchronized lockfiles only
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npx --yes npm@11.19.1 install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix apps/web
          unexpected="$(git status --porcelain --untracked-files=all | grep -vE '^( M|M |MM) (package-lock.json|apps/web/package-lock.json)$' || true)"
          test -z "$unexpected"

      - name: Verify generated graphs and lint compatibility
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --yes npm@11.19.1 ci --ignore-scripts --prefix apps/web
          npm run lint --prefix apps/web
          npm audit --json > /tmp/root-audit.json
          npx --yes npm@11.19.1 audit --json --prefix apps/web > /tmp/web-audit.json
          node - <<'NODE'
          const fs = require('node:fs')
          for (const name of ['root', 'web']) {
            const report = JSON.parse(fs.readFileSync('/tmp/' + name + '-audit.json', 'utf8'))
            const total = Number(report?.metadata?.vulnerabilities?.total ?? 0)
            console.log(name, report.metadata?.vulnerabilities ?? {})
            if (total !== 0) process.exitCode = 1
          }
          NODE

      - name: Commit only synchronized lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json apps/web/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/web/package-lock.json
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          unexpected="$(printf '%s\n' "$staged" | grep -vE '^(package-lock.json|apps/web/package-lock.json)$' || true)"
          test -z "$unexpected"
          git commit -m "Synchronize zero-audit Content lockfiles"
          git push origin HEAD:hardening/content-review-supply-chain-20261005
